# 开发覆盖层: make dev 使用 (compose -f deploy/docker-compose.yml -f deploy/docker-compose.dev.yml)
# 与线上的差异只有: 源码热挂载 + 调试端口 + 开发态 ingest/admin-web
services:
  postgres:
    ports: ["5432:5432"]   # 仅开发态映射到宿主机

  marzban:
    ports: ["8080:8080"]
    environment:
      LOG_LEVEL: debug

  xray-edge:
    ports: ["10086:10086"] # 开发态本地直连调试
    cap_add: ["NET_ADMIN"]   # work-8.2 chaos.sh: 容器内 iptables DROP 上游演练

  ingest:
    build:
      context: ../services
      dockerfile: ingest/Dockerfile.dev   # air 热重载
    command: ["air"]
    volumes:
      - ../services/ingest:/src
      - ../services/webui:/webui   # 共享模块 (replace ../webui → /webui)
      - ../services/webkit:/webkit # gin 共享中间件套件 (replace ../webkit → /webkit)
      - ingest-data:/data
      - xray-edge-config:/configs
    ports: ["9100:9100"]   # ingest API 调试
    # chaos.sh 在 ingest 容器内对上游拨号目标做 iptables DROP (prober 在这里跑)
    cap_add: ["NET_ADMIN"]
    environment:
      INGEST_API_ADDR: :9100
      XRAY_CONFIG: /configs/config.json
      DB_PATH: /data/ingest.db
      # 开发态密集探测; chaos 需短间隔 (EvictFails=3 × 15s ≈ 45s 摘除; .env 的 1h 用于 soak)
      PROBE_INTERVAL: "15s"
      PROBE_RETRY_PERIOD: "15s"   # dev/chaos 快回池 (线上保持默认 2m)
      EDGE_ACCESS_LOG: /tmp/xray-access.log   # load-50 按 outbound tag 聚合分流分布 (仅开发态)

  user-center:
    build:
      context: ../services
      dockerfile: user-center/Dockerfile.dev   # air 热重载
    command: ["air"]
    volumes:
      - ../services/user-center:/src
      - ../services/webui:/webui
      - ../services/webkit:/webkit   # gin 共享中间件套件(replace 目录), air 热重载实时生效
    ports: ["9200:9200"]   # user-center 调试
    environment:
      USERCENTER_ADDR: :9200
      # MARZBAN_API_BASE: http://marzban:8080   # work-6 联调后启用

  dev-shell:
    image: golang:1.26
    working_dir: /src
    volumes:
      - ..:/src        # 整个 repo 挂进
      - go-mod-cache:/go/pkg/mod
    command: sleep infinity
    network_mode: "service:ingest"  # 与 ingest 同网段, 可直连 postgres/xray-edge

volumes:
  ingest-data:
  go-mod-cache:
