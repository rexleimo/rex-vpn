# air 热重载配置 (容器内工作目录 /src = 挂载的 services/ingest)
# air@latest (v1.5x+) 新式 schema: build 命令/产物在 [build] 段
root = "."
tmp_dir = "tmp"

[build]
  # Windows bind-mount 下 fsnotify 不触发容器内事件: 轮询兜底(air v1.67: build.poll)
  poll = true
  poll_interval = 1000
  cmd = "go build -o ./tmp/ingest-bin ./cmd/ingest"
  bin = "./tmp/ingest-bin"

[log]
  time = true

[watch]
  exclude = ["tmp", "testdata"]
